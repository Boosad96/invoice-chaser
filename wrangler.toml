name = "invoice-chaser"
main = "src/index.js"
compatibility_date = "2026-11-04"

# D1 database binding. Before deploying with the CLI, create the database and
# replace the placeholder id below with the real one:
#   wrangler d1 create invoice-chaser-db
# Then apply the migrations:
#   wrangler d1 migrations apply invoice-chaser-db --remote
# If you deploy via the Cloudflare dashboard's Git integration instead, create
# the D1 database in the dashboard and add a binding named DB pointing at it;
# the dashboard binding takes effect for that deployment.
[[d1_databases]]
binding = "DB"
database_name = "invoice-chaser-db"
database_id = "00000000-0000-0000-0000-000000000000"

# Daily reminder job: 09:00 UTC. Cloudflare cron is UTC only.
# Uses 1 of the 5 free cron triggers per account.
[triggers]
crons = ["0 9 * * *"]

# Optional: set RESEND_FROM in the dashboard (or via wrangler secret/var) once
# your own domain is verified in Resend, e.g. "Invoice Chaser <reminders@yourdomain.com>".
# Without it, mail is sent from onboarding@resend.dev, which Resend only
# delivers to your own account email — fine for testing, not for customers.
# RESEND_API_KEY must be set as a Worker secret (never in this repo):
#   wrangler secret put RESEND_API_KEY
